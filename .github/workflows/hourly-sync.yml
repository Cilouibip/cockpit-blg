name: Actualiser le cockpit

on:
  schedule:
    # GitHub may drop scheduled starts. Extra wakeups resume work; the worker
    # skips sources already covered for the current hour and retains its lease.
    - cron: '17,37,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cockpit-hourly-sync
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Signaler une configuration incomplète
        if: ${{ env.CRON_SECRET == '' }}
        run: |
          echo "CRON_SECRET absent : actualisation horaire non activée." >&2
          exit 1
      - name: Lancer une unité bornée
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          deadline=$((SECONDS + 720))
          response_file="$(mktemp)"
          trap 'rm -f -- "$response_file"' EXIT
          # Drain healthy sources after a failed unit. Persistent errors still fail
          # this run; one summary replaces repeated per-unit failure annotations.
          while (( SECONDS < deadline )); do
            # A regular output file is reset by curl before a retry. Stdout
            # cannot be rewound and would concatenate failed and final JSON.
            if ! curl --silent --show-error --fail-with-body \
              --max-time 90 --retry 2 --retry-delay 2 --retry-max-time 100 \
              --output "$response_file" \
              --header "Authorization: Bearer $CRON_SECRET" \
              https://cockpit-blg.vercel.app/api/jobs/tick; then
              echo "Lecture du tick interrompue ; les checkpoints sont conservés." >&2
              exit 1
            fi
            if ! status="$(jq -ers 'if length == 1 and (.[0].status | IN("complete","partial","waiting","failed")) then .[0].status else error("invalid tick response") end' "$response_file" 2>/dev/null)"; then
              echo "Réponse d’actualisation invalide." >&2
              exit 1
            fi
            jq -c '{status,units,unitResults,streams,measurements,schedulerMeasurements}' "$response_file"
            case "$status" in
              complete) exit 0 ;;
              partial) sleep 1 ;;
              waiting) sleep 15 ;;
              failed)
                echo "Sources saines traitées ; une source reste en échec. Dernier rapport valide conservé." >&2
                exit 1 ;;
              *) echo "Réponse d’actualisation invalide." >&2; exit 1 ;;
            esac
          done
          echo "La fenêtre bornée est terminée avec du travail restant ; reprise persistante au prochain passage." >&2
          exit 1
