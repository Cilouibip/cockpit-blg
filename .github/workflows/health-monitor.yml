name: Surveiller les publications du cockpit

on:
  schedule:
    # Separate from the collector. GitHub may delay/drop starts; this is not a guaranteed alert clock.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cockpit-health-monitor
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Contrôler les publications sans actualiser
        shell: bash
        run: |
          node --input-type=module <<'JS'
          // Only fixed verdicts/codes reach public logs. Never print the response or exception.
          const emit = (status, codes) => console.log(JSON.stringify({status,codes}));
          const secret = process.env.CRON_SECRET;
          if (!secret || secret.length < 32) { emit('unknown',['HEALTH_CONFIG_MISSING']); process.exit(1); }
          const expectedJobs = ['notion','meta_ads','masterclass','forms','kpi_meta','kpi_posthog','kpi_email'];
          const allowedCodes = new Set(['PUBLICATION_CURRENT','CONFIGURATION_UNKNOWN','DATABASE_UNAVAILABLE','CLOCK_INVALID','PUBLICATION_ABSENT','PUBLICATION_INVALID','TIMESTAMP_INVALID','TIMESTAMP_FUTURE','TIMESTAMP_ORDER_INVALID','CURRENT_WINDOW_MISMATCH','COVERAGE_INVALID','PUBLICATION_STALE','LATEST_ATTEMPT_FAILED']);
          const instant = value => {
            if (typeof value !== 'string') return null;
            const at = Date.parse(value);
            return Number.isSafeInteger(at) && new Date(at).toISOString() === value ? at : null;
          };
          try {
            const requestStarted = Date.now();
            const response = await fetch('https://cockpit-blg.vercel.app/api/jobs/health', {
              method:'GET',headers:{Authorization:'Bearer '+secret},redirect:'error',signal:AbortSignal.timeout(30000)
            });
            const text = await response.text();
            if (text.length > 16384) throw Error();
            const clientNow = Date.now();
            const report = JSON.parse(text), states = ['healthy','stale','unknown'];
            if (!states.includes(report.status) || !Array.isArray(report.jobs) || report.jobs.length !== expectedJobs.length ||
                new Set(report.jobs.map(job=>job.job)).size !== expectedJobs.length ||
                report.jobs.some(job=>!expectedJobs.includes(job.job)||!states.includes(job.state)||!allowedCodes.has(job.code)) ||
                report.maxAgeMinutes !== 60) throw Error();
            const checkedAt = instant(report.checkedAt);
            if (checkedAt === null || checkedAt < requestStarted || checkedAt > clientNow || clientNow - checkedAt > 60000) throw Error();
            for (const job of report.jobs.filter(job=>job.state==='healthy')) {
              const cutoff = instant(job.cutoff), publishedAt = instant(job.publishedAt);
              // Independently evaluate source age on the monitor clock. A cached
              // or forged ageMinutes cannot turn an old/future cutoff healthy.
              if (cutoff === null || publishedAt === null || cutoff > publishedAt || publishedAt > checkedAt ||
                  cutoff > clientNow || clientNow - cutoff > 60*60000 || job.code !== 'PUBLICATION_CURRENT') throw Error();
            }
            const status = report.jobs.some(job=>job.state==='unknown')?'unknown':report.jobs.some(job=>job.state==='stale')?'stale':'healthy';
            if (report.status !== status || (status==='healthy' && (!response.ok || report.jobs.some(job=>job.code!=='PUBLICATION_CURRENT')))) throw Error();
            emit(status,[...new Set(report.jobs.map(job=>job.code))].sort());
            process.exitCode = status==='healthy'?0:1;
          } catch { emit('unknown',['HEALTH_ENDPOINT_UNAVAILABLE_OR_INVALID']); process.exitCode=1; }
          JS
